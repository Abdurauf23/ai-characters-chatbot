quarkus:
  # HTTP
  http:
    port: 8080
    cors:
      origins: "/.*/"

  # S3 client configuration (for Quarkus Amazon Services extension)
  # This configures the auto-provided S3Client bean
  s3:
    endpoint-override: "http://localhost:9000"
    path-style-access: true
    sync-client:
      type: "url"
    aws:
      credentials:
        type: "static"
        static-provider:
          access-key-id: "minioadmin"
          secret-access-key: "minioadmin"

# Storage service configuration (S3-compatible)
# Supports: RustFS, MinIO, AWS S3, Ceph, and other S3-compatible backends
storage:
  bucket-name: "storage"

  # S3-compatible endpoint configuration
  s3:
    endpoint: "http://localhost:9000"
    access-key-id: "minioadmin"
    secret-access-key: "minioadmin"
    path-style-access: true

  # Presigned URL configuration
  presigned-url:
    expiration: "1h"

  # Circuit breaker configuration
  circuit-breaker:
    request-volume-threshold: 4
    delay: "5s"
    success-threshold: 2

# Kafka / Redpanda
kafka:
  bootstrap:
    servers: "localhost:19092"

mp:
  messaging:
    outgoing:
      storage-events-out:
        connector: "smallrye-kafka"
        topic: "storage.events"
        value:
          serializer: "io.quarkus.kafka.client.serialization.ObjectMapperSerializer"
